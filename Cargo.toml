[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored with a patch: not ours to lint or test.
exclude = ["vendor/egui-winit"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
web-time = "=1.1.0"
env_logger = "=0.11.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
earcutr = "=0.5.0"
schemars = "=1.2.2"
png = "=0.18.1"
base64 = "=0.23.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
qrcode = { version = "=0.14.1", default-features = false }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"
egui_kittest = "=0.36.2"
egui-phosphor = "=0.14.0"
rfd = "=0.17.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }
muda = { version = "=0.21.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSProcessInfo", "NSString", "NSObject"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
skrifa = "=0.44.0"

# egui-winit 0.36.2 does not build for wasm32 (its dropped-file type lacks the web method); the
# copy in vendor/ is the same crate with that one method added under cfg(wasm32).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

# Dependencies are built optimized and without debug info in dev and test builds: tests that
# inflate, parse JSON or draw with wgpu run several times faster, the build output stays small
# enough to link on CI runners, and the workspace crates stay unoptimized so they rebuild quickly.
# No debug info for the workspace crates either. On macOS each build otherwise leaves its object
# files in target/debug/deps under new names (the debug map points at them), and a folder of
# hundreds of thousands of files made every GPU test wait ~25 s: Metal reads the folder of the
# test program at start-up. Panics still name the file and line; backtraces show functions only.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false

# The browser build (scripts/build-web.sh): small and linked as one unit, since the page
# downloads it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
