[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
log = "=0.4.34"
env_logger = "=0.11.11"
