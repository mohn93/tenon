[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
env_logger = "=0.11.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
earcutr = "=0.5.0"
schemars = "=1.2.2"
png = "=0.18.1"
base64 = "=0.23.1"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"
egui_kittest = "=0.36.2"
egui-phosphor = "=0.14.0"
rfd = "=0.17.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }
muda = { version = "=0.21.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependencies are built optimized and without debug info in dev and test builds: tests that
# inflate, parse JSON or draw with wgpu run several times faster, the build output stays small
# enough to link on CI runners, and the workspace crates stay unoptimized so they rebuild quickly.
[profile.dev.package."*"]
opt-level = 2
debug = false
