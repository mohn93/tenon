[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
env_logger = "=0.11.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
earcutr = "=0.5.0"
schemars = "=1.2.2"
png = "=0.18.1"
base64 = "=0.23.1"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"
