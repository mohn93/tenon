[package]
name = "web"
version.workspace = true
edition.workspace = true
description = "Tenon in a browser canvas"

[lib]
# cdylib is what wasm-bindgen turns into the page's module; rlib lets the native gate test the
# parts that do not touch the browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
app = { path = "../app" }
session = { path = "../session" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
render = { path = "../render" }
wgpu = { workspace = true, features = ["webgl"] }
winit.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "AbortController",
    "AbortSignal",
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "Window",
    "console",
] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
