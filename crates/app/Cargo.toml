[package]
name = "app"
version.workspace = true
edition.workspace = true

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
render = { path = "../render" }
session = { path = "../session" }
tools = { path = "../tools" }
api = { path = "../api" }
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
web-time.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-phosphor.workspace = true
serde.workspace = true
serde_json.workspace = true
kernel = { path = "../kernel" }

# Native only: the window's blocking GPU setup, dialogs, the system clipboard and logging.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { workspace = true, features = ["accesskit"] }
pollster.workspace = true
env_logger.workspace = true
rfd.workspace = true
# The system clipboard for Cut, Copy and Paste; egui-winit already uses this version.
arboard = { version = "=3.6.1", default-features = false }
# Help > Check for Updates asks the GitHub API for the latest release, only when chosen.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

# The browser has no system clipboard crate or links crate: egui-winit's defaults need them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "=0.36.2", default-features = false, features = ["accesskit"] }

# O_NOFOLLOW for the Open on Phone server's files.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
muda.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
egui_kittest.workspace = true

# The Windows icon and version resource, embedded only when SKETCHUP_ALT_WINRES is set (the
# packaging workflow), so ordinary builds do not depend on the resource compiler.
[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"
