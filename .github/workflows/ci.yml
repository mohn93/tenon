name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.99.0

jobs:
  linux:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Mesa lavapipe is the software Vulkan adapter wgpu finds; the libraries are the runtime
      # set of the window app. Keep in step with scripts/linux.Dockerfile.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libxkbcommon0 libwayland-client0 \
            libx11-6 libxcursor1 libxrandr2 libxi6 libxkbcommon-x11-0 libwayland-cursor0 libwayland-egl1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-${{ env.RUST_VERSION }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # Renders tests write (golden diffs, debug images) under target/tmp; kept when tests fail.
      - name: Upload test images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-images-${{ matrix.arch }}
          path: target/tmp/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-${{ env.RUST_VERSION }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # Renders tests write (golden diffs, debug images) under target/tmp; kept when tests fail.
      - name: Upload test images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-images-windows
          path: target/tmp/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Unsigned zip of the release build, made on pushes to main only.
  package-windows:
    name: package windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-release-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-release-${{ env.RUST_VERSION }}-

      # The C runtime is linked in, so the zip needs no Visual C++ redistributable.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p app

      # Lists the DLLs named in app.exe (its import table holds them as plain ASCII) and fails
      # when the Visual C++ runtime is among them.
      - name: Check imports
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/app.exe")
          $text = [System.Text.Encoding]::Latin1.GetString($bytes)
          $dlls = [regex]::Matches($text, '[A-Za-z0-9_.-]{2,40}\.dll') |
            ForEach-Object { $_.Value.ToLower() } | Sort-Object -Unique
          $dlls
          $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib)' }
          if ($bad) { throw "app.exe imports the Visual C++ runtime: $bad" }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath sketchup-alt-windows-x86_64.zip -Path `
            target/release/app.exe, THIRD_PARTY_NOTICES.md, docs/windows.md

      - uses: actions/upload-artifact@v4
        with:
          name: sketchup-alt-windows-x86_64
          path: sketchup-alt-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
